# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC), so no token is stored. npm only offers that for an existing
# package: publish the first version by hand, then add this repository and
# release.yml as a trusted publisher in the package's settings on npmjs.com.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm publish --provenance --access public
